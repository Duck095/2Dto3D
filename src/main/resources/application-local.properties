# Safe defaults for local API startup. Payment endpoints stay pointed at
# localhost.invalid, and Cloudinary media operations need separate local/test setup.
spring.flyway.enabled=false

vnpay.tmn-code=${VNPAY_CODE:local-disabled}
vnpay.hash-secret=${VNPAY_SECRET:local-disabled}
vnpay.pay-url=http://localhost.invalid/vnpay/pay

momo.partner-code=${MOMO_PARTNER_CODE:local-disabled}
momo.access-key=${MOMO_ACCESS_KEY:local-disabled}
momo.secret-key=${MOMO_SECRET_KEY:local-disabled}
momo.endpoint=http://localhost.invalid/momo/create

cloudinary.cloud-name=${CLOUD_NAME:local-disabled}
cloudinary.api-key=${API_KEY:local-disabled}
cloudinary.api-secret=${API_SECRET:local-disabled}
cloudinary.base-url=http://localhost.invalid/cloudinary
