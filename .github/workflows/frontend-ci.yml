name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 2Dto3D_FE/package-lock.json

      - name: Install dependencies
        working-directory: 2Dto3D_FE
        run: npm ci

      - name: Set deterministic feature flags for checkout safety tests
        working-directory: 2Dto3D_FE
        run: |
          cat > .env.development.local <<'EOF'
          VITE_FEATURE_AI_STUDIO=true
          VITE_FEATURE_CART=true
          VITE_FEATURE_CHECKOUT=true
          VITE_FEATURE_PRINT_QUOTE=true
          VITE_DEMO_MODE=false
          EOF

      - name: Check FE and BE contracts from this monorepo commit
        working-directory: 2Dto3D_FE
        run: npm run test:crossrepo

      - name: Run unit tests
        working-directory: 2Dto3D_FE
        run: npm test

      - name: Build production bundle
        working-directory: 2Dto3D_FE
        run: npm run build
