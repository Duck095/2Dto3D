name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Java 17 / Maven 3.9.9 / PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 2Dto3D_BE/pom.xml

      - name: Verify Docker and preload pinned PostgreSQL image
        working-directory: 2Dto3D_BE
        env:
          POSTGRES_IMAGE: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        run: |
          docker info
          docker pull "$POSTGRES_IMAGE"
          docker tag "$POSTGRES_IMAGE" postgres:16-alpine
          docker image inspect "$POSTGRES_IMAGE" postgres:16-alpine > /dev/null

      - name: Verify Maven Wrapper distribution
        working-directory: 2Dto3D_BE
        run: grep -Fx 'distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip' .mvn/wrapper/maven-wrapper.properties

      - name: Build and run tests
        working-directory: 2Dto3D_BE
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
