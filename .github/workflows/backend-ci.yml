name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Java 17 / Maven 3.9.9 / PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan reachable Git history for secrets
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          --workdir /repo
          zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git '--log-opts=--all --full-history -m' --redact=100 .

      - name: Set up Node.js 22 for browser-backed backend acceptance tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 2Dto3D_FE/package-lock.json

      - name: Install frontend dependencies
        working-directory: 2Dto3D_FE
        run: npm ci --no-audit --no-fund

      - name: Install Microsoft Edge and Playwright Linux dependencies
        working-directory: 2Dto3D_FE
        run: npx playwright install --with-deps msedge
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 2Dto3D_BE/pom.xml

      - name: Verify Docker and preload pinned PostgreSQL image
        working-directory: 2Dto3D_BE
        env:
          POSTGRES_IMAGE: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        run: |
          docker info
          docker pull "$POSTGRES_IMAGE"
          docker tag "$POSTGRES_IMAGE" postgres:16-alpine
          docker image inspect "$POSTGRES_IMAGE" postgres:16-alpine > /dev/null

      - name: Verify Maven Wrapper distribution
        working-directory: 2Dto3D_BE
        run: |
          set -o pipefail
          sed 's/\r$//' .mvn/wrapper/maven-wrapper.properties |
            grep -Fx -- 'distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip'

      - name: Focused PostgreSQL persistence tests in discovery order
        working-directory: 2Dto3D_BE
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dtest=AdminProductMeshHttpIntegrationTest,MediaAssetLegacySchemaMigrationPostgresTest,MediaAssetMigrationPostgresTest,MediaAssetPersistenceTest,MaterialRetirementIntegrationTest,MaterialRetirementJpaIntegrationTest,ModelAggregatePersistenceTest,ProductSecurityIntegrationTest,PublicProductCatalogRepositoryTest,StaffManagementTransactionIntegrationTest,TaskManagementServiceTest
          test

      - name: Focused PostgreSQL persistence tests in reverse order
        working-directory: 2Dto3D_BE
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dsurefire.runOrder=reversealphabetical
          -Dtest=AdminProductMeshHttpIntegrationTest,MediaAssetLegacySchemaMigrationPostgresTest,MediaAssetMigrationPostgresTest,MediaAssetPersistenceTest,MaterialRetirementIntegrationTest,MaterialRetirementJpaIntegrationTest,ModelAggregatePersistenceTest,ProductSecurityIntegrationTest,PublicProductCatalogRepositoryTest,StaffManagementTransactionIntegrationTest,TaskManagementServiceTest
          test

      - name: Full Backend clean verify
        working-directory: 2Dto3D_BE
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: PayOS browser E2E on disposable PostgreSQL
        working-directory: 2Dto3D_BE
        run: bash ./mvnw --batch-mode --no-transfer-progress -Dtest=PayosFinalAcceptanceBrowserE2E test

      - name: Verify Testcontainers cleanup
        if: always()
        run: |
          for attempt in $(seq 1 60); do
            remaining="$(docker ps -aq --filter label=org.testcontainers=true)"
            if [ -z "$remaining" ]; then break; fi
            sleep 1
          done
          docker ps -a --format 'table {{.ID}}\t{{.Image}}\t{{.Names}}\t{{.Status}}'
          docker volume ls --format 'table {{.Name}}\t{{.Driver}}'
          remaining="$(docker ps -aq --filter label=org.testcontainers=true)"
          remaining_volumes="$(docker volume ls -q --filter label=org.testcontainers=true)"
          if [ -n "$remaining" ]; then
            echo "Testcontainers resources remain after backend verification: $remaining"
            exit 1
          fi
          if [ -n "$remaining_volumes" ]; then
            echo "Testcontainers volumes remain after backend verification: $remaining_volumes"
            exit 1
          fi
