# QA must use a dedicated disposable/approved QA database and secret set.
spring.datasource.url=${QA_DB_URL}
spring.datasource.username=${QA_DB_USERNAME}
spring.datasource.password=${QA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

jwt.secret=${QA_JWT_SECRET}
jwt.expiration=3600000

app.features.ai.enabled=false
app.features.quote.enabled=false
app.features.cart.enabled=false
app.features.order.enabled=false
app.features.checkout.enabled=false
app.features.payment.enabled=false
app.features.admin-product-snapshot-upload.enabled=false

media.lifecycle.reconciliation-enabled=false

# QA media-live is opt-in and requires a separate Operations approval value and QA-only credentials.
app.qa-media.live-enabled=${APP_QA_MEDIA_LIVE_ENABLED:false}
app.qa-media.live-approved=${QA_MEDIA_LIVE_APPROVED:false}
app.qa-media.cloud-name=${QA_CLOUDINARY_CLOUD_NAME:qa-disabled}
app.qa-media.api-key=${QA_CLOUDINARY_API_KEY:}
app.qa-media.api-secret=${QA_CLOUDINARY_API_SECRET:}
app.qa-media.proxy-host=${QA_CLOUDINARY_PROXY_HOST:}
app.qa-media.proxy-port=${QA_CLOUDINARY_PROXY_PORT:0}
# Lifecycle validation and URL resolution use the same identity as the SDK in QA media-live.
cloudinary.cloud-name=${app.qa-media.cloud-name}
cloudinary.base-url=

server.error.include-message=never
server.error.include-stacktrace=never
