# Local API defaults keep payments disabled; media uses the configured real Cloudinary account.
spring.flyway.enabled=false
spring.datasource.username=${DB_USERNAME}
# Local startup is for read-only schema verification; do not run media recovery/cleanup jobs.
media.lifecycle.reconciliation-enabled=false

vnpay.tmn-code=${VNPAY_CODE:local-disabled}
vnpay.hash-secret=${VNPAY_SECRET:local-disabled}
vnpay.pay-url=http://localhost.invalid/vnpay/pay

momo.partner-code=${MOMO_PARTNER_CODE:local-disabled}
momo.access-key=${MOMO_ACCESS_KEY:local-disabled}
momo.secret-key=${MOMO_SECRET_KEY:local-disabled}
momo.endpoint=http://localhost.invalid/momo/create

cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}
cloudinary.base-url=https://res.cloudinary.com/${CLOUD_NAME}/image/upload
# In Cloudinary dynamic-folder mode, asset_folder controls Media Library placement;
# public_id remains the server-generated product-media path used by delivery URLs.
media.storage.cloudinary-folder-policy=local-product-media
